# MazelProtocol — Rust Formatting Configuration
#
# This file is read by `cargo fmt` and by editors that support rustfmt.
# All member crates in the workspace inherit these settings.
#
# To format the workspace: cargo fmt --all

edition = "2021"
max_width = 100
use_small_heuristics = "Max"
format_strings = true
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
newline_style = "Auto"
normalize_comments = true
reorder_impl_items = true
use_field_init_shorthand = true
