[package]
name = "mazelprotocol-draw-bot"
version = "2.0.0"
edition = "2021"
description = "Draw lifecycle bot for MazelProtocol — Rust edition. Handles commit, execute, index, and finalize phases for both Main Lottery and Quick Pick Express."
license = "MIT"

[[bin]]
name = "mazelprotocol-draw-bot"
path = "src/main.rs"

[dependencies]
# Solana SDK (granular crates — avoids solana-sdk `full` → solana-precompiles
# → openssl-sys, which cannot build on Windows without a system OpenSSL).
solana-client = "2.2"
solana-keypair = "2.2"
solana-commitment-config = "2.2"
solana-instruction = "2.2"
solana-pubkey = { version = "2", features = ["rand"] }
solana-signature = "2"
solana-signer = "2"
solana-system-interface = "1"
solana-transaction = "2.2"
solana-program = "2.2"
solana-account-decoder = "2.2"

# Anchor — for account deserialization
anchor-lang = "0.32"
borsh = "0.10"

# On-chain program crates — single source of truth for account layouts.
# Using the program structs directly (instead of hand-rolled mirrors) means
# the bot can never drift out of sync with a field added to the programs.
# `no-entrypoint` avoids duplicate `entrypoint` symbols when both program
# libs are linked into the bot binary.
mazelprotocol = { path = "../programs/mazelprotocol", default-features = false, features = ["no-entrypoint"] }
quickpick = { path = "../programs/quickpick", default-features = false, features = ["no-entrypoint"] }

# Switchboard on-demand — randomness account layout + program IDs.
# Deliberately WITHOUT the `client` feature: the client feature pulls the
# full solana-sdk (openssl-sys on Windows). The randomness account structs
# are bytemuck pods available in the base crate; the single
# `randomness_commit` instruction is built manually from its documented
# layout in commit.rs.
switchboard-on-demand = "0.11.3"
bytemuck = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for Telegram API
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Cryptography
sha2 = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = "0.4"

# UUID for nonces
uuid = { version = "1", features = ["v4"] }

# Cron scheduling
tokio-cron-scheduler = "0.13"

[dev-dependencies]
