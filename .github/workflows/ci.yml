name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.32.1"
  NODE_VERSION: "20"

jobs:
  # ── Rust: format, lint, check ──────────────────────────────────────────
  rust-checks:
    name: Rust Checks (fmt + clippy + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Run cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: |
          # Workspace-wide lint is warn-only for now: the Anchor programs and
          # customer bot carry pre-existing clippy debt that must be cleared
          # incrementally. The bots are kept strict so regressions there
          # still fail the build. `--no-deps` keeps the strict flag scoped to
          # the bot crates themselves (the draw bot links the program crates
          # as path dependencies, whose pre-existing warnings must not fail
          # the build).
          cargo clippy --all
          cargo clippy -p mazelprotocol-draw-bot --all-targets --no-deps -- -D warnings
          cargo clippy -p mazelprotocol-customer-bot --all-targets --no-deps -- -D warnings

      - name: Run cargo check
        run: cargo check --all

      - name: Run cargo test (unit tests, validator-free)
        # --lib keeps the program crates validator-free (no local validator /
        # RPC needed). The bot crates are bin-only — they have no lib target,
        # so `--workspace --lib` would fail on them with "no library targets
        # found" — run their bin unit tests in a second pass instead.
        run: |
          cargo test --workspace --lib --exclude mazelprotocol-draw-bot --exclude mazelprotocol-customer-bot
          cargo test -p mazelprotocol-draw-bot -p mazelprotocol-customer-bot

  # ── Anchor integration tests (local validator) ────────────────────────
  anchor-test:
    name: Anchor Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies (npm)
        run: |
          npm ci

      - name: Run anchor test
        run: anchor test

  # ── Frontend app checks ───────────────────────────────────────────────
  app-checks:
    name: App Checks (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Test (vitest)
        run: pnpm test

      - name: Lint (Biome)
        run: pnpm exec biome check

      - name: Build
        run: pnpm build

  # ── Bot checks ─────────────────────────────────────────────────────────
  bot-builds:
    name: Rust Bot Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build draw bot
        run: cargo build -p mazelprotocol-draw-bot

      - name: Build customer bot
        run: cargo build -p mazelprotocol-customer-bot
